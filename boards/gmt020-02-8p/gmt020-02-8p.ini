; ============================================================================
; Bruce board: ESP32-S3 DevKit + OTFTSPI GMT020-02-8P
;
; Display : OTFTSPI GMT020-02-8P, 2.0", 240x320, ST7789V, 4-wire SPI, 3V3 logic
; MCU     : ESP32-S3 (N16R8 assumed: 16MB flash, 8MB OPI PSRAM)
; Input   : 3 tactile buttons (UP / SELECT / DOWN), active LOW, INPUT_PULLUP
;
; Known-working TFT wiring (proven on this board with LovyanGFX):
;   GND -> GND        VCC -> 3V3
;   SCL(SCLK) -> G12  SDA(MOSI) -> G11
;   RST -> G4         DC  -> G5
;   CS  -> G10        BL  -> 3V3 (always on, no PWM pin)
;
; Buttons:  UP -> G6   SELECT -> G7   DOWN -> G8
;
; Display backend: TFT_eSPI (default here). A drop-in LovyanGFX fallback that
; mirrors the exact known-good config is kept, commented, in pins_arduino.h.
; ============================================================================

[env:gmt020-02-8p]
board = gmt020-02-8p
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_opi   ; N16R8: QIO flash + OPI (octal) PSRAM
build_src_filter = ${env.build_src_filter} +<../boards/gmt020-02-8p>
build_flags =
	${env.build_flags}
	-Iboards/gmt020-02-8p
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_USB_CDC_ON_BOOT=1   ; USB-CDC serial console on the S3 native USB port
	-DBOARD_HAS_PSRAM=1

	; --- TFT SPI port on ESP32-S3 ---
	-DUSE_HSPI_PORT=1

	; --- No SD card on this board ---
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; The board has no dedicated IR / sub-GHz / NFC hardware. We do NOT declare
	; any radio module present (no -DUSE_CC1101_VIA_SPI, -DUSE_NRF24_VIA_SPI,
	; etc.), so those subsystems stay dormant. Free expansion GPIOs are exposed
	; in pins_arduino.h and ALLOW_ALL_GPIO_FOR_IR_RF lets you pick a pin at
	; runtime if you wire an external module later.
	-DALLOW_ALL_GPIO_FOR_IR_RF=1

	-DDEVICE_NAME='"ESP32-S3 GMT020-02-8P"'

lib_deps =
	${env.lib_deps}

; ----------------------------------------------------------------------------
; LovyanGFX fallback env (known-good driver for this exact panel).
; Enable by: (1) uncommenting this env, (2) setting USE_LOVYANGFX in
; pins_arduino.h (see the commented block there), and (3) uncommenting the
; LovyanGFX lib line below. See boards/gmt020-02-8p/connections.md.
; ----------------------------------------------------------------------------
;[env:gmt020-02-8p-lovyan]
;extends = env:gmt020-02-8p
;build_flags =
;	${env:gmt020-02-8p.build_flags}
;	-DUSE_LOVYANGFX=1
;lib_deps =
;	${env:gmt020-02-8p.lib_deps}
;	; Released 1.2.7 is not compatible with the current Arduino 3.3.x core;
;	; use the develop branch as noted in lib/HAL/display/README.md.
;	https://github.com/lovyan03/LovyanGFX#develop
